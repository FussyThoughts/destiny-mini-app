<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СУДЬБА</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #09090f;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 520px;
}

h1 {
    text-align: center;
    font-size: 42px;
    margin: 0 0 30px;
    letter-spacing: 6px;
}

.progress {
    text-align: center;
    color: #777788;
    margin-bottom: 20px;
    font-size: 14px;
}

.question {
    font-size: 23px;
    line-height: 1.4;
    margin-bottom: 25px;
    text-align: center;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

button {
    width: 100%;
    padding: 18px;
    border: 1px solid #333344;
    border-radius: 14px;
    background: #151522;
    color: #ffffff;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
}

button:hover {
    background: #202033;
}

button:active {
    transform: scale(0.98);
}

.result {
    text-align: center;
}

.result-symbol {
    font-size: 65px;
    margin-bottom: 10px;
}

.result h2 {
    font-size: 30px;
    margin: 10px 0;
}

.rarity {
    display: inline-block;
    padding: 7px 16px;
    border: 1px solid #555566;
    border-radius: 20px;
    margin: 10px 0 20px;
    font-size: 14px;
}

.path {
    font-size: 18px;
    margin-bottom: 20px;
}

.description {
    color: #cccccc;
    line-height: 1.6;
    font-size: 17px;
    margin-bottom: 25px;
}

.restart {
    text-align: center;
}

.restart button {
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">
    <h1>СУДЬБА</h1>
    <div id="quiz"></div>
</div>

<script>

const questions = [

    {
        text: "Ты станешь собой без капли сожаления, выбрав…",
        answers: [
            {
                text: "⚔️ Силу, с которой нельзя не считаться.",
                path: "Сила"
            },
            {
                text: "👑 Власть, устрашающую и благодетельную.",
                path: "Власть"
            },
            {
                text: "❤️ Любовь, от которой невозможно отказаться.",
                path: "Любовь"
            },
            {
                text: "🕊️ Свободу в каждом вдохе.",
                path: "Свобода"
            }
        ]
    },

    {
        text: "Предательство коснулось тебя. Что ты сделаешь?",
        answers: [
            {
                text: "☠️ Раздашь угощения всем причастным. Пусть каждый получит то, что заслужил.",
                path: "Сила"
            },
            {
                text: "🌊 Станешь каплей в океане. Исчезнешь из их жизни, оставив всё в прошлом.",
                path: "Свобода"
            },
            {
                text: "🧹 Заменишь все тряпки в доме. Простишь. Даже если помнить придётся всегда.",
                path: "Любовь"
            },
            {
                text: "⚔️ Обнажишь зеркальный клинок. Ответишь им тем же — ни больше, ни меньше.",
                path: "Власть"
            }
        ]
    },

    {
        text: "Перед тобой врата бессмертия. Но чтобы открыть их, кто-то должен остаться по ту сторону. Что ты сделаешь?",
        answers: [
            {
                text: "🩸 Пройдёшь сквозь врата. Чужая судьба — не моя цена.",
                path: "Сила"
            },
            {
                text: "🚪 Оставишь врата закрытыми. Есть вещи, ради которых не стоит становиться бессмертным.",
                path: "Любовь"
            },
            {
                text: "🌙 Искать третий путь. Если судьба поставила два выбора — значит, она что-то скрывает.",
                path: "Свобода"
            },
            {
                text: "👁️ Сначала посмотришь, кто стоит за вратами. Прежде чем сделать шаг, нужно увидеть всю картину.",
                path: "Власть"
            }
        ]
    },

    {
        text: "Если Небеса потребуют от тебя отдать самое дорогое, что ты не позволишь им забрать?",
        answers: [
            {
                text: "🪞 Своё отражение. Я не позволю себе стать кем-то другим.",
                path: "Свобода"
            },
            {
                text: "🏯 Тех, кого называю семьёй. Пусть рушатся Небеса — их я не отдам.",
                path: "Любовь"
            },
            {
                text: "🕊️ Свободу. Даже вечная жизнь не стоит одной цепи.",
                path: "Свобода"
            },
            {
                text: "🌑 Смысл. Если исчезнет он — зачем тогда мне всё остальное?",
                path: "Власть"
            }
        ]
    },

    {
        text: "Однажды тебе в руки попадёт сила, которой больше нет ни у кого. Что станет твоим первым шагом?",
        answers: [
            {
                text: "🌫️ Спрячешь её. Самая опасная сила — та, о которой знают все.",
                path: "Свобода"
            },
            {
                text: "❤️ Отдашь её тем, кто тебе дорог. Если сила ничего не меняет для близких — зачем она нужна?",
                path: "Любовь"
            },
            {
                text: "👑 Поставишь мир на колени. Тот, кто получил силу, должен решить, как ею распорядиться.",
                path: "Власть"
            },
            {
                text: "🔮 Попытаешься понять её. Прежде чем использовать силу, я хочу узнать, почему она выбрала меня.",
                path: "Сила"
            }
        ]
    }

];

let currentQuestion = 0;
let scores = {
    "Сила": 0,
    "Власть": 0,
    "Любовь": 0,
    "Свобода": 0
};

const quiz = document.getElementById("quiz");

function showQuestion() {

    const question = questions[currentQuestion];

    quiz.innerHTML = "";

    const progress = document.createElement("div");
    progress.className = "progress";
    progress.textContent =
        "Вопрос " + (currentQuestion + 1) +
        " из " + questions.length;

    const questionText = document.createElement("div");
    questionText.className = "question";
    questionText.textContent = question.text;

    const answersContainer = document.createElement("div");
    answersContainer.className = "answers";

    question.answers.forEach(function(answer) {

        const button = document.createElement("button");

        button.type = "button";
        button.textContent = answer.text;

        button.addEventListener("click", function() {

            scores[answer.path]++;

            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }

        });

        answersContainer.appendChild(button);

    });

    quiz.appendChild(progress);
    quiz.appendChild(questionText);
    quiz.appendChild(answersContainer);
}


function showResult() {

    let destiny = getDestiny();

    quiz.innerHTML = "";

    const result = document.createElement("div");
    result.className = "result";

    result.innerHTML = `
        <div class="result-symbol">${destiny.symbol}</div>

        <h2>${destiny.name}</h2>

        <div class="rarity">
            ${destiny.rarity}
        </div>

        <div class="path">
            Путь: <strong>${destiny.path}</strong>
        </div>

        <div class="description">
            ${destiny.description}
        </div>

        <div class="restart">
            <button id="restartButton">
                🔄 Узнать другую судьбу
            </button>
        </div>
    `;

    quiz.appendChild(result);

    document
        .getElementById("restartButton")
        .addEventListener("click", restartQuiz);
}


function getDestiny() {

    let maxScore = 0;
    let selectedPath = "Сила";

    for (let path in scores) {

        if (scores[path] > maxScore) {
            maxScore = scores[path];
            selectedPath = path;
        }

    }

    const destinies = {

        "Сила": {
            symbol: "⚔️",
            name: "Носитель Кровавого Клинка",
            rarity: "🔥 РЕДКАЯ СУДЬБА",
            path: "Силы",
            description:
                "Ты не ищешь лёгких путей. " +
                "Когда судьба закрывает перед тобой дверь, " +
                "ты ищешь способ пробить стену. " +
                "Но помни: сила способна защитить тебя от мира — " +
                "и одновременно отдалить тебя от него."
        },

        "Власть": {
            symbol: "👑",
            name: "Властелин Девяти Небес",
            rarity: "👑 ЭПИЧЕСКАЯ СУДЬБА",
            path: "Власти",
            description:
                "Ты способен смотреть на мир сверху, " +
                "не позволяя обстоятельствам диктовать тебе путь. " +
                "Ты понимаешь цену решений и не боишься её платить. " +
                "Но чем выше поднимается человек, тем меньше вокруг него тех, " +
                "кто осмелится сказать ему правду."
        },

        "Любовь": {
            symbol: "❤️",
            name: "Хранитель Последнего Обета",
            rarity: "💎 ЛЕГЕНДАРНАЯ СУДЬБА",
            path: "Любви",
            description:
                "Ты способен сохранить то, что другие давно сочли потерянным. " +
                "Для тебя связь между людьми может оказаться сильнее смерти. " +
                "Но однажды тебе придётся решить, " +
                "сколько собственной судьбы ты готов отдать ради другого."
        },

        "Свобода": {
            symbol: "🕊️",
            name: "Странник За Пределами Небес",
            rarity: "🌙 МИФИЧЕСКАЯ СУДЬБА",
            path: "Свободы",
            description:
                "Ты не принадлежишь ни одному пути полностью. " +
                "Когда мир предлагает тебе выбор между двумя дорогами, " +
                "ты ищешь третью. " +
                "Возможно, именно поэтому однажды ты окажешься там, " +
                "куда ещё не ступала нога человека."
        }

    };

    return destinies[selectedPath];
}


function restartQuiz() {

    currentQuestion = 0;

    scores = {
        "Сила": 0,
        "Власть": 0,
        "Любовь": 0,
        "Свобода": 0
    };

    showQuestion();
}


showQuestion();

</script>

</body>
</html>
