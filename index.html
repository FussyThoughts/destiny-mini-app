<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100c18">
<title>СУДЬБА</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 25%, #281842 0%, #100c18 42%, #050508 100%);
    color: #ffffff;
    font-family: Georgia, "Times New Roman", serif;
}

button {
    font-family: inherit;
}

.hidden {
    display: none !important;
}

.screen {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}


/* =========================
   START
========================= */

.symbol {
    font-size: 68px;
    margin-bottom: 16px;
    opacity: 0.92;
    animation: float 4s ease-in-out infinite;
}

.start-title {
    margin: 0;
    font-size: 52px;
    font-weight: 400;
    letter-spacing: 10px;
}

.subtitle {
    max-width: 390px;
    margin-top: 22px;
    color: #cfc6dc;
    font-size: 18px;
    line-height: 1.6;
}

.start-button {
    margin-top: 40px;
    padding: 17px 32px;
    border: 1px solid #9279ad;
    border-radius: 12px;
    background: rgba(120, 80, 160, 0.18);
    color: #ffffff;
    font-size: 17px;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s ease;
}

.start-button:hover {
    background: rgba(140, 100, 180, 0.28);
}

.start-button:active {
    transform: scale(0.97);
}

.note {
    margin-top: 17px;
    color: #777080;
    font-family: Arial, sans-serif;
    font-size: 13px;
}


/* =========================
   QUIZ
========================= */

.quiz {
    width: 100%;
}

.progress {
    margin-bottom: 27px;
    color: #987fb0;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
}

.question {
    max-width: 500px;
    margin: 0 auto 30px;
    font-size: 24px;
    line-height: 1.45;
    font-weight: 400;
}

.answers {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 17px 18px;
    border: 1px solid rgba(143, 120, 173, 0.55);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.035);
    color: #eee9f2;
    font-size: 16px;
    line-height: 1.42;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s ease;
}

.answer:hover {
    background: rgba(143, 120, 173, 0.15);
    border-color: #a48abb;
}

.answer:active {
    transform: scale(0.98);
}


/* =========================
   VISUAL DESTINY PROFILE
========================= */

.profile-visual {
    position: relative;
    margin: 24px auto 4px;
    width: 174px;
    height: 174px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.profile-aura {
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(170, 120, 220, 0.22) 0%, rgba(90, 55, 130, 0.08) 48%, transparent 72%);
    border: 1px solid rgba(190, 155, 220, 0.28);
    box-shadow: 0 0 42px rgba(140, 90, 190, 0.22), inset 0 0 28px rgba(255,255,255,0.04);
    animation: profilePulse 3.5s ease-in-out infinite;
}

.profile-ring {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 1px solid rgba(205, 181, 225, 0.55);
    transform: rotate(45deg);
}

.profile-ring::before,
.profile-ring::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d8c6e6;
    box-shadow: 0 0 12px rgba(220, 195, 240, 0.75);
}

.profile-ring::before { top: -3px; left: 50%; }
.profile-ring::after { bottom: -3px; right: 50%; }

.profile-avatar {
    position: relative;
    z-index: 2;
    width: 106px;
    height: 106px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(35, 24, 48, 0.96) 58%);
    border: 2px solid rgba(216, 198, 230, 0.72);
    box-shadow: 0 0 28px rgba(145, 95, 190, 0.25), inset 0 0 22px rgba(255,255,255,0.06);
    font-size: 55px;
}

.profile-stats {
    margin: 20px auto 0;
    max-width: 330px;
    padding: 12px 14px;
    border: 1px solid rgba(190,155,220,.16);
    border-radius: 14px;
    background: rgba(255,255,255,.025);
}
.stat-row {
    display: grid;
    grid-template-columns: 82px 1fr 22px;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
    color: #b8a8c1;
    font: 10px Arial, sans-serif;
    letter-spacing: .7px;
}
.stat-row b { color: #e0d2e7; font-size: 10px; text-align: right; }
.stat-track { height: 5px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.08); }
.stat-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #806099, #d7c0e5); transition: width .8s ease; }

.profile-label {
    margin-top: 3px;
    color: #887691;
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
}

.profile-rank {
    margin-top: 7px;
    color: #c9b7d5;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
}

.profile-power {
    margin: 18px auto 0;
    max-width: 330px;
    text-align: left;
}

.profile-power-head {
    display: flex;
    justify-content: space-between;
    color: #8d7b98;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
}

.profile-power-track {
    height: 4px;
    margin-top: 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
}

.profile-power-fill {
    height: 100%;
    width: 50%;
    border-radius: inherit;
    background: linear-gradient(90deg, #80609c, #d2b5e6);
    box-shadow: 0 0 12px rgba(185, 140, 220, 0.45);
    transition: width 0.8s ease;
}

@keyframes profilePulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.035); opacity: 1; }
}

/* =========================
   RESULT CARD
========================= */

.result-screen {
    padding-top: 25px;
    padding-bottom: 25px;
}

.destiny-card {
    width: 100%;
    padding: 31px 23px;
    border: 1px solid rgba(154, 130, 180, 0.65);
    border-radius: 23px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(143, 120, 173, 0.19),
            rgba(10, 8, 15, 0.96) 58%
        );

    box-shadow:
        0 0 45px rgba(90, 55, 120, 0.18),
        inset 0 0 35px rgba(255, 255, 255, 0.025);

    position: relative;
    overflow: hidden;

    animation: destinyAppear 0.75s ease;
}

.destiny-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 16%;
    right: 16%;
    height: 1px;
    background: rgba(255, 255, 255, 0.35);
}

.card-top {
    color: #9279ad;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
}

.result-symbol {
    margin-top: 24px;
    font-size: 65px;
    animation: symbolAppear 0.9s ease;
}

.result-rarity {
    margin-top: 18px;
    color: #d0bddc;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
}

.result-path {
    margin-top: 9px;
    color: #8f7aa0;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.result-title {
    max-width: 460px;
    margin: 12px auto 0;
    font-size: 31px;
    line-height: 1.28;
    font-weight: 400;
}

.result-trait {
    margin-top: 12px;
    color: #a99cad;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.card-divider {
    margin: 24px auto 19px;
    color: #806b91;
    font-size: 14px;
}

.result-description {
    max-width: 430px;
    margin: 0 auto;
    color: #d0c8d6;
    font-size: 16px;
    line-height: 1.72;
}

.card-footer {
    margin-top: 27px;
    color: #706675;
    font-family: Arial, sans-serif;
    font-size: 11px;
    line-height: 1.5;
}

.share-button {
    width: 100%;
    margin-top: 23px;
    padding: 16px 28px;
    border: 1px solid #9279ad;
    border-radius: 12px;
    background: rgba(120, 80, 160, 0.18);
    color: #ffffff;
    font-size: 15px;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s ease;
}

.share-button:hover {
    background: rgba(140, 100, 180, 0.28);
    border-color: #a48abb;
}

.share-button:active {
    transform: scale(0.98);
}

.share-button:disabled {
    opacity: 0.65;
    cursor: default;
}

.friend-button {
    width: 100%;
    margin-top: 23px;
    padding: 18px 28px;
    border: 1px solid #b18ad2;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(150, 95, 205, 0.30), rgba(90, 55, 130, 0.22));
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s ease;
    box-shadow: 0 8px 28px rgba(100, 60, 150, 0.18);
}

.friend-button:hover {
    background: linear-gradient(135deg, rgba(165, 105, 220, 0.40), rgba(105, 65, 150, 0.30));
    border-color: #c7a4e4;
    transform: translateY(-1px);
}

.friend-button:active {
    transform: scale(0.98);
}

.friend-button:disabled {
    opacity: 0.65;
    cursor: default;
}

.restart-button {
    margin-top: 23px;
    padding: 14px 28px;
    border: 1px solid #665477;
    border-radius: 10px;
    background: transparent;
    color: #aaa0b4;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
}

.restart-button:active {
    transform: scale(0.97);
}


.challenge-banner {
    width: 100%;
    box-sizing: border-box;
    margin: 22px 0 4px;
    padding: 14px 16px;
    border: 1px solid rgba(177, 138, 210, 0.55);
    border-radius: 13px;
    background: rgba(120, 80, 160, 0.12);
    text-align: center;
    animation: fadeIn 0.4s ease;
}

.challenge-kicker {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #b99ad2;
    margin-bottom: 7px;
}

.challenge-text {
    color: #eee7f3;
    font-size: 14px;
    line-height: 1.45;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes float {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

@keyframes destinyAppear {

    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes symbolAppear {

    0% {
        opacity: 0;
        transform: scale(0.5) rotate(-10deg);
    }

    70% {
        transform: scale(1.08) rotate(2deg);
    }

    100% {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.fade {
    animation: fadeIn 0.4s ease;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 420px) {

    .screen {
        padding-left: 16px;
        padding-right: 16px;
    }

    .start-title {
        font-size: 45px;
        letter-spacing: 8px;
    }

    .question {
        font-size: 21px;
    }

    .answer {
        font-size: 15px;
        padding: 16px;
    }

    .result-title {
        font-size: 27px;
    }

    .destiny-card {
        padding: 28px 19px;
    }
}
</style>
</head>


<body>


<!-- =========================
     START SCREEN
========================= -->

<section id="startScreen" class="screen">

    <div class="symbol">☯</div>

    <h1 class="start-title">
        СУДЬБА
    </h1>

    <div class="subtitle">
        Небеса уже сделали свой выбор.<br>
        Осталось узнать — какой.
    </div>

    <div id="challengeBanner" class="challenge-banner hidden">
        <div class="challenge-kicker">⚔️ ТЕБЕ БРОСИЛИ ВЫЗОВ</div>
        <div id="challengeText" class="challenge-text"></div>
    </div>

    <button
        id="startButton"
        class="start-button"
        type="button"
    >
        ✦ Узнать свою судьбу
    </button>

    <div class="note">
        5 вопросов · 1 судьба
    </div>

</section>


<!-- =========================
     QUIZ SCREEN
========================= -->

<section id="quizScreen"
class="screen hidden">

    <div class="quiz">

        <div id="progress" class="progress">
            ВОПРОС 1 ИЗ 5
        </div>

        <h2 id="question" class="question"></h2>

        <div id="answers" class="answers"></div>

    </div>

</section>


<!-- =========================
     RESULT SCREEN
========================= -->

<section id="resultScreen" class="screen result-screen hidden">

    <div class="destiny-card">

        <div class="card-top">
            ТВОЙ ВИЗУАЛЬНЫЙ ПРОФИЛЬ
        </div>

        <div class="profile-visual">
            <div class="profile-aura"></div>
            <div class="profile-ring"></div>
            <div id="profileAvatar" class="profile-avatar">☯</div>
        </div>

        <div id="profileLabel" class="profile-label">ПРОБУЖДЁННАЯ СУДЬБА</div>
        <div id="profileRank" class="profile-rank"></div>

        <div class="profile-power">
            <div class="profile-power-head">
                <span>ВЕС СУДЬБЫ</span>
                <span id="profilePowerText">50%</span>
            </div>
            <div class="profile-power-track">
                <div id="profilePowerFill" class="profile-power-fill"></div>
            </div>
        </div>

        <div class="profile-stats" id="profileStats">
            <div class="stat-row"><span>Сила</span><div class="stat-track"><div id="statStrength" class="stat-fill"></div></div><b id="statStrengthText">0</b></div>
            <div class="stat-row"><span>Воля</span><div class="stat-track"><div id="statWill" class="stat-fill"></div></div><b id="statWillText">0</b></div>
            <div class="stat-row"><span>Верность</span><div class="stat-track"><div id="statLoyalty" class="stat-fill"></div></div><b id="statLoyaltyText">0</b></div>
            <div class="stat-row"><span>Непокорность</span><div class="stat-track"><div id="statRebellion" class="stat-fill"></div></div><b id="statRebellionText">0</b></div>
        </div>

        <div class="result-symbol hidden" id="resultSymbol">
            ☯
        </div>

        <div id="resultRarity" class="result-rarity"></div>

        <div id="resultPath" class="result-path"></div>

        <h2 id="resultTitle" class="result-title"></h2>

        <div id="resultTrait" class="result-trait"></div>

        <div class="card-divider">
            ✦
        </div>

        <div id="resultDescription" class="result-description"></div>

        <div class="card-footer">
            Эта судьба выбрана пятью решениями.
        </div>

    </div>

    <button
        id="friendButton"
        class="friend-button"
        type="button"
    >
        ⚔️ Бросить вызов другу
    </button>

    <button
        id="shareBtn"
        class="share-button"
        type="button"
    >
        ✦ Поделиться судьбой
    </button>

    <button
        id="restartButton"
        class="restart-button"
        type="button"
    >
        Пройти заново
    </button>

</section>


<script>

/* =========================
   QUESTIONS
========================= */

const questions = [

    {
        text: "Ты станешь собой без капли сожаления, выбрав…",
        answers: [
            "⚔️ Силу, с которой нельзя не считаться.",

    {
        text: "Предательство коснулось тебя. Что ты сделаешь?",

            "☠️ Раздашь угощения всем причастным. Пусть каждый получит то, что заслужил.",

    {

        answers: [
            "🩸 Пройдёшь сквозь врата. Чужая судьба — не моя цена.",
            "🚪 Оставишь врата закрытыми. Есть вещи, ради которых не стоит становиться бессмертным.",

        ]
    },

    {
        text: "Если Небеса потребуют от тебя отдать самое дорогое, что ты не позволишь им забрать?",
        answers: [

    },

    {

            "🌫️ Спрячешь её. Самая опасная сила — та, о которой знают все.",
            "❤️ Отдашь её тем, кто тебе дорог. Если сила ничего не меняет для близких — зачем она нужна?",
            "👑 Поставишь мир на колени. Тот, кто получил силу, должен решить, как ею распорядиться.",

        ]
    }

];


/* =========================
   16 DESTINIES
========================= */

const destinies = [

    {

        rarity: "🔥 Редкая",

/* =========================
   PATHS
========================= */

const paths = [
    "Сила",
    "Власть",
      "Любовь",
    "Свобода"
];


/* =========================
   STATE
========================= */

let currentQuestion = 0;
let currentDestinyIndex = -1;

let selectedAnswers = [];

let pathScores = {
    "Сила": 0,
    "Власть": 0,
    "Любовь": 0,
    "Свобода": 0
};

let stats = {
    strength: 0,
    power: 0,
    love: 0,
    freedom: 0,
    cruelty: 0,
    loyalty: 0,
    rebellion: 0,
    sacrifice: 0
};

========================= */

/* =========================
   SCREEN CONTROL
========================= */

function showScreen(screen) {

    startScreen.classList.add("hidden");

    quizScreen.classList.add("hidden");

    resultScreen.classList.add("hidden");

    screen.classList.remove("hidden");

}


/* =========================
   RESET
========================= */

function resetGame() {

    currentQuestion = 0;

    selectedAnswers = [];

    pathScores = {
        "Сила": 0,
        "Власть": 0,
        "Любовь": 0,
        "Свобода": 0
    };

    stats = {
        strength: 0,
        power: 0,
        love: 0,
        freedom: 0,
        cruelty: 0,
        loyalty: 0,
        rebellion: 0,
        sacrifice: 0
    };

}


/* =========================
   APPLY ANSWER
========================= */

function applyAnswer(questionIndex, answerIndex) {

    const path = paths[answerIndex];

    pathScores[path]++;


    if (path === "Сила") {
        stats.strength++;
    }

    if (path === "Власть") {
        stats.power++;
    }

    if (path === "Любовь") {
        stats.love++;
    }

    if (path === "Свобода") {
        stats.freedom++;
    }


    /* QUESTION 1 */

    if (questionIndex === 0) {

        if (answerIndex === 0) {
            stats.strength++;
        }

        if (answerIndex === 1) {
            stats.power++;
        }

        if (answerIndex === 2) {
            stats.love++;
            stats.loyalty++;
        }

        if (answerIndex === 3) {
            stats.freedom++;
            stats.rebellion++;
        }

    }


    /* QUESTION 2 */

    if (questionIndex === 1) {

        if (answerIndex === 0) {
            stats.cruelty++;
        }

        if (answerIndex === 1) {
            stats.freedom++;
        }

        if (answerIndex === 2) {
            stats.loyalty++;
            stats.sacrifice++;
        }

        if (answerIndex === 3) {
            stats.strength++;
            stats.rebellion++;
        }

    }


    /* QUESTION 3 */

    if (questionIndex === 2) {

        if (answerIndex === 0) {
            stats.strength++;
            stats.cruelty++;
        }

        if (answerIndex === 1) {
            stats.love++;
            stats.sacrifice++;
        }

        if (answerIndex === 2) {
            stats.rebellion++;
            stats.freedom++;
        }

        if (answerIndex === 3) {
            stats.power++;
        }

    }


    /* QUESTION 4 */

    if (questionIndex === 3) {

        if (answerIndex === 0) {
            stats.rebellion++;
        }

        if (answerIndex === 1) {
            stats.love++;
            stats.loyalty++;
            stats.sacrifice++;
        }

        if (answerIndex === 2) {
            stats.freedom++;
            stats.rebellion++;
        }

        if (answerIndex === 3) {
            stats.love++;
            stats.strength++;
        }

    }


    /* QUESTION 5 */

    if (questionIndex === 4) {

        if (answerIndex === 0) {
            stats.power++;
        }

        if (answerIndex === 1) {
            stats.love++;
            stats.sacrifice++;
        }

        if (answerIndex === 2) {
            stats.power++;
            stats.cruelty++;
        }

        if (answerIndex === 3) {
            stats.strength++;
            stats.freedom++;
        }

    }

}


/* =========================
   MAIN PATH
========================= */

function getMainPath() {

    let bestPath = "Сила";

    let bestScore = pathScores["Сила"];


    if (pathScores["Власть"] > bestScore) {

        bestPath = "Власть";

        bestScore = pathScores["Власть"];

    }


    if (pathScores["Любовь"] > bestScore) {

        bestPath = "Любовь";

        bestScore = pathScores["Любовь"];

    }


    if (pathScores["Свобода"] > bestScore) {

        bestPath = "Свобода";

        bestScore = pathScores["Свобода"];

    }


    return bestPath;

}


/* =========================
   DESTINY
========================= */

function getDestiny() {

    const mainPath = getMainPath();

    const candidates = destinies.filter(function(destiny) {
        return destiny.path === mainPath;
    });

    /*
       Судьба теперь определяется не одним порогом, а резонансом
       нескольких скрытых черт. Это делает близкие ответы разными,
       но сохраняет связь результата с выбором игрока.
    */

    let scores = [0, 0, 0, 0];

    if (mainPath === "Сила") {
        scores = [
            stats.cruelty * 3 + stats.rebellion,
            stats.loyalty * 3 + stats.sacrifice * 2,
            stats.cruelty * 2 + stats.rebellion * 3,
            stats.strength + stats.freedom * 4
        ];
    }

    if (mainPath === "Власть") {
        scores = [
            stats.power * 3 + stats.strength,
            stats.loyalty * 3 + stats.sacrifice,
            stats.power * 2 + stats.rebellion * 3,
            stats.power * 3 + stats.cruelty * 2
        ];
    }

    if (mainPath === "Любовь") {
        scores = [
            stats.loyalty * 3 + stats.sacrifice,
            stats.love * 3 + stats.sacrifice * 2,
            stats.loyalty * 2 + stats.love * 2 + stats.rebellion,
            stats.sacrifice * 4 + stats.love
        ];
    }

    if (mainPath === "Свобода") {
        scores = [
            stats.freedom * 3 + stats.strength,
            stats.freedom * 2 + stats.rebellion * 2,
            stats.rebellion * 4,
            stats.freedom * 3 + stats.rebellion * 2 + stats.strength
        ];
    }

    let index = 0;
    let bestScore = scores[0];

    for (let i = 1; i < scores.length; i++) {
        if (scores[i] > bestScore) {
            bestScore = scores[i];
            index = i;
        }
    }

    /*
       Если два архетипа имеют одинаковый резонанс, порядок ответов
       становится последним решением Небес. Поэтому даже очень похожие
       комбинации не обязаны давать одну и ту же судьбу.
    */
    const tieIndexes = [];

    for (let i = 0; i < scores.length; i++) {
        if (scores[i] === bestScore) tieIndexes.push(i);
    }

    if (tieIndexes.length > 1) {
        const fateSignature = selectedAnswers.reduce(function(sum, answer, i) {
            return sum + (answer + 1) * (i + 2) * (i + 3);
        }, 0);

        index = tieIndexes[fateSignature % tieIndexes.length];
    }

    return candidates[index] || candidates[0];
}


/* =========================
   SHOW RESULT
========================= */

function showResult() {

    const destiny = getDestiny();
    currentDestinyIndex = destinies.indexOf(destiny);

    resultSymbol.textContent =
        destiny.symbol;

    profileAvatar.textContent = destiny.symbol;

    const rarityPower = destiny.rarity.indexOf("Мифическая") !== -1
        ? 100
        : destiny.rarity.indexOf("Эпическая") !== -1
            ? 72
            : 45;

    profileRank.textContent = destiny.rarity.replace(/^[^А-ЯЁ]+/u, "").toUpperCase();
    profilePowerText.textContent = rarityPower + "%";
    profilePowerFill.style.width = rarityPower + "%";

    const profileValues = {
        strength: stats.strength,
        will: stats.power + stats.strength,
        loyalty: stats.loyalty + stats.sacrifice,
        rebellion: stats.rebellion + stats.freedom
    };

    const maxProfile = Math.max(5, ...Object.values(profileValues));

    statStrength.style.width = Math.round(profileValues.strength / maxProfile * 100) + "%";
    statWill.style.width = Math.round(profileValues.will / maxProfile * 100) + "%";
    statLoyalty.style.width = Math.round(profileValues.loyalty / maxProfile * 100) + "%";
    statRebellion.style.width = Math.round(profileValues.rebellion / maxProfile * 100) + "%";

    statStrengthText.textContent = profileValues.strength;
    statWillText.textContent = profileValues.will;
    statLoyaltyText.textContent = profileValues.loyalty;
    statRebellionText.textContent = profileValues.rebellion;

    resultTitle.textContent =
        destiny.title;

    resultRarity.textContent =
        destiny.rarity;

    resultPath.textContent =
        "Путь: " + destiny.path;

    resultTrait.textContent =
        destiny.trait;

    resultDescription.textContent =
        destiny.description;


    showScreen(resultScreen);

}


/* =========================
   QUESTION
========================= */

function showQuestion() {

    const q =
        questions[currentQuestion];


    progress.textContent =
        "ВОПРОС " +
        (currentQuestion + 1) +
        " ИЗ " +
        questions.length;


    question.textContent =
        q.text;


    answers.innerHTML = "";


    answers.classList.remove("fade");

    void answers.offsetWidth;

    answers.classList.add("fade");


    q.answers.forEach(function(
        answerText,
        index
    ) {

        const button =
            document.createElement("button");


        button.type = "button";

        button.className = "answer";

        button.textContent =
            answerText;


        button.addEventListener(
            "click",
            function() {

                selectedAnswers.push({

                    question: currentQuestion,

                    answer: index

                });


                applyAnswer(
                    currentQuestion,
                    index
                );


                currentQuestion++;


                if (
                    currentQuestion <
                    questions.length
                ) {

                    showQuestion();

                } else {

                    showResult();

                }

            }
        );


        answers.appendChild(button);

    });

}


/* =========================
   INCOMING CHALLENGE
========================= */

function loadChallenge() {

    // По умолчанию баннер всегда скрыт.
    // Он появляется только при специальной ссылке ?c=...
    challengeBanner.classList.add("hidden");
    challengeText.textContent = "";

    const params = new URLSearchParams(window.location.search);
    const rawId = params.get("c");
    const compactId = rawId === null ? NaN : Number(rawId);

    if (!Number.isInteger(compactId) || !destinies[compactId]) {
        return;
    }

    const destiny = destinies[compactId];

    challengeText.textContent =
        "Тебе бросили вызов судьбой «" +
        destiny.title +
        "». Сможешь получить судьбу сильнее?";

    challengeBanner.classList.remove("hidden");

    // После чтения вызова очищаем URL.
    // Перезагрузка страницы уже открывает обычную игру.
    window.history.replaceState(
        {},
        document.title,
        window.location.origin + window.location.pathname
    );

}
loadChallenge();

/* =========================
   SHARE
========================= */

function getShareMessage() {

    return (
        "Мне выпала судьба «" +
        resultTitle.textContent +
        "».\n" +
        resultRarity.textContent +
        " · " +
        resultPath.textContent +
        "\n\n" +
        "А какая судьба достанется тебе?"
    );

}


function haptic() {

    if (
        tg &&
        tg.HapticFeedback &&
        tg.HapticFeedback.impactOccurred
    ) {

        try {
            tg.HapticFeedback.impactOccurred("light");
        } catch (error) {
            console.warn("Haptic feedback:", error);
        }

    }

}


async function openShare(text, title, shareUrl) {

    const url = shareUrl || window.location.href;

    haptic();

    /* Telegram */
    if (tg && tg.openTelegramLink) {

        const telegramShareUrl =
            "https://t.me/share/url?url=" +
            encodeURIComponent(url) +
            "&text=" +
            encodeURIComponent(text);

        try {
            tg.openTelegramLink(telegramShareUrl);
            return;
        } catch (error) {
            console.warn("Telegram share:", error);
        }

    }

    /* Browser native share */
    if (
        navigator.share &&
        typeof navigator.share === "function"
    ) {

        try {

            await navigator.share({
                title: title,
                text: text,
                url: url
            });

            return;

        } catch (error) {

            if (
                error &&
                error.name === "AbortError"
            ) {
                return;
            }

        }

    }

    /* Clipboard */
    try {

        if (
            navigator.clipboard &&
            navigator.clipboard.writeText
        ) {

            await navigator.clipboard.writeText(
                text + "\n" + url
            );

            alert(
                "Готово! Текст скопирован.\n\n" +
                "Отправь его другу."
            );

            return;

        }

    } catch (error) {

        console.warn("Clipboard:", error);

    }

    /* Old browser fallback */
    window.prompt(
        "Скопируй приглашение:",
        text + "\n" + url
    );

}


async function shareDestiny() {

    await openShare(
        getShareMessage(),
        "Моя судьба — " +
        resultTitle.textContent
    );

}


async function challengeFriend() {

    const destinyId = currentDestinyIndex >= 0
        ? currentDestinyIndex
        : destinies.findIndex(function(destiny) {
            return destiny.title === resultTitle.textContent;
        });

    const challengeUrl =
        window.location.origin +
        window.location.pathname +
        "?c=" +
        encodeURIComponent(destinyId);

    await openShare(
        "Мне выпала судьба «" +
        resultTitle.textContent +
        "».\n\n" +
        "⚔️ Бросаю тебе вызов. Пройди испытание и узнай, какая судьба достанется тебе.",
        "Вызов судьбы",
        challengeUrl
    );

}
