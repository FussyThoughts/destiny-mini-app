<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СУДЬБА</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #09090f;
        color: #f5f5f5;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .app {
        width: 100%;
        max-width: 520px;
    }

    h1 {
        text-align: center;
        font-size: 42px;
        margin: 0 0 30px;
        letter-spacing: 6px;
    }

    .question {
        font-size: 24px;
        line-height: 1.35;
        margin-bottom: 25px;
        text-align: center;
    }

    .answers {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    button {
        width: 100%;
        padding: 18px;
        border: 1px solid #333344;
        border-radius: 14px;
        background: #151522;
        color: #ffffff;
        font-size: 17px;
        text-align: left;
        cursor: pointer;
        touch-action: manipulation;
        transition: 0.15s;
    }

    button:hover {
        background: #202033;
    }

    button:active {
        transform: scale(0.98);
    }

    .progress {
        text-align: center;
        color: #777788;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .result {
        text-align: center;
        font-size: 22px;
        line-height: 1.5;
    }
</style>
</head>

<body>

<div class="app">
    <h1>СУДЬБА</h1>

    <div id="quiz"></div>
</div>

<script>
const questions = [
    {
        text: "Ты станешь собой без капли сожаления, выбрав…",
        answers: [
            "⚔️ Силу, с которой нельзя не считаться.",
            "👑 Власть, устрашающую и благодетельную.",
            "❤️ Любовь, от которой невозможно отказаться.",
            "🕊️ Свободу в каждом вдохе."
        ]
    },

    {
        text: "Предательство коснулось тебя. Что ты сделаешь?",
        answers: [
            "☠️ Раздашь угощения всем причастным. Пусть каждый получит то, что заслужил.",
            "🌊 Станешь каплей в океане. Исчезнешь из их жизни, оставив всё в прошлом.",
            "🧹 Заменишь все тряпки в доме. Простишь. Даже если помнить придётся всегда.",
            "⚔️ Обнажишь зеркальный клинок. Ответишь им тем же — ни больше, ни меньше."
        ]
    },

    {
        text: "Перед тобой врата бессмертия. Но чтобы открыть их, кто-то должен остаться по ту сторону. Что ты сделаешь?",
        answers: [
            "🩸 Пройдёшь сквозь врата. Чужая судьба — не моя цена.",
            "🚪 Оставишь врата закрытыми. Есть вещи, ради которых не стоит становиться бессмертным.",
            "🌙 Искать третий путь. Если судьба поставила два выбора — значит, она что-то скрывает.",
            "👁️ Сначала посмотришь, кто стоит за вратами. Прежде чем сделать шаг, нужно увидеть всю картину."
        ]
    },

    {
        text: "Если Небеса потребуют от тебя отдать самое дорогое, что ты не позволишь им забрать?",
        answers: [
            "🪞 Своё отражение. Я не позволю себе стать кем-то другим.",
            "🏯 Тех, кого называю семьёй. Пусть рушатся Небеса — их я не отдам.",
            "🕊️ Свободу. Даже вечная жизнь не стоит одной цепи.",
            "🌑 Смысл. Если исчезнет он — зачем тогда мне всё остальное?"
        ]
    },

    {
        text: "Однажды тебе в руки попадёт сила, которой больше нет ни у кого. Что станет твоим первым шагом?",
        answers: [
            "🌫️ Спрячешь её. Самая опасная сила — та, о которой знают все.",
            "❤️ Отдашь её тем, кто тебе дорог. Если сила ничего не меняет для близких — зачем она нужна?",
            "👑 Поставишь мир на колени. Тот, кто получил силу, должен решить, как ею распорядиться.",
            "🔮 Попытаешься понять её. Прежде чем использовать силу, я хочу узнать, почему она выбрала меня."
        ]
    }
];

let currentQuestion = 0;
let userAnswers = [];

const quiz = document.getElementById("quiz");

function showQuestion() {
    const question = questions[currentQuestion];

    quiz.innerHTML = "";

    const progress = document.createElement("div");
    progress.className = "progress";
    progress.textContent = "Вопрос " + (currentQuestion + 1) + " из " + questions.length;

    const questionText = document.createElement("div");
    questionText.className = "question";
    questionText.textContent = question.text;

    const answersContainer = document.createElement("div");
    answersContainer.className = "answers";

    question.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = answer;

        button.addEventListener("click", function() {
            userAnswers.push(index);
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        });

        answersContainer.appendChild(button);
    });

    quiz.appendChild(progress);
    quiz.appendChild(questionText);
    quiz.appendChild(answersContainer);
}

function showResult() {
    quiz.innerHTML = "";

    const result = document.createElement("div");
    result.className = "result";

    result.innerHTML = `
        <h2>Твоя судьба пробуждается…</h2>
        <p>Пять решений уже сделаны.</p>
        <p>Теперь Небеса знают тебя.</p>
    `;

    quiz.appendChild(result);
}

showQuestion();
</script>

</body>
</html>
