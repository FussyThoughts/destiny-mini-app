<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">

<title>СУДЬБА</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 35%, #17172a 0%, #09090f 55%, #050509 100%);
    color: #f5f5f5;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 520px;
}

/* =========================
   START SCREEN
========================= */

.start {
    text-align: center;
    animation: fadeIn 1.2s ease;
}

.start-symbol {
    font-size: 72px;
    margin-bottom: 18px;
    opacity: 0.95;
    animation: float 4s ease-in-out infinite;
}

.start h1 {
    font-size: 52px;
    margin: 0;
    letter-spacing: 10px;
}

.start-line {
    width: 100px;
    height: 1px;
    background: #555566;
    margin: 25px auto;
}

.start-subtitle {
    font-size: 19px;
    line-height: 1.7;
    color: #cccccc;
    margin-bottom: 35px;
}

.start-button {
    width: 100%;
    max-width: 360px;
    padding: 19px;
    border: 1px solid #555566;
    border-radius: 16px;
    background: linear-gradient(135deg, #181827, #222238);
    color: white;
    font-size: 18px;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s;
}

.start-button:hover {
    background: #292940;
}

.start-button:active {
    transform: scale(0.97);
}

.start-note {
    margin-top: 20px;
    color: #666677;
    font-size: 13px;
}

/* =========================
   QUIZ
========================= */

.quiz-screen {
    animation: fadeIn 0.5s ease;
}

h1 {
    text-align: center;
    font-size: 42px;
    margin: 0 0 30px;
    letter-spacing: 6px;
}

.progress {
    text-align: center;
    color: #777788;
    margin-bottom: 20px;
    font-size: 14px;
}

.question {
    font-size: 23px;
    line-height: 1.4;
    margin-bottom: 25px;
    text-align: center;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

button {
    width: 100%;
    padding: 18px;
    border: 1px solid #333344;
    border-radius: 14px;
    background: #151522;
    color: #ffffff;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s;
}

button:hover {
    background: #202033;
}

button:active {
    transform: scale(0.98);
}

/* =========================
   RESULT
========================= */

.result {
    text-align: center;
    animation: fadeIn 1s ease;
}

.result-symbol {
    font-size: 65px;
    margin-bottom: 10px;
}

.result h2 {
    font-size: 30px;
    margin: 10px 0;
}

.rarity {
    display: inline-block;
    padding: 7px 16px;
    border: 1px solid #555566;
    border-radius: 20px;
    margin: 10px 0 20px;
    font-size: 14px;
}

.path {
    font-size: 18px;
    margin-bottom: 20px;
}

.description {
    color: #cccccc;
    line-height: 1.6;
    font-size: 17px;
    margin-bottom: 25px;
}

.restart {
    text-align: center;
}

.restart button {
    text-align: center;
    margin-top: 10px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}
</style></head><body><div class="app">

</div><script>

            },
            {
                text: "❤️ Отдашь её тем, кто тебе дорог. Если сила ничего не меняет для близких — зачем она нужна?",
                path: "Любовь",
                stats: { sacrifice: 2, loyalty: 1 }
            },
            {
                text: "👑 Поставишь мир на колени. Тот, кто получил силу, должен решить, как ею распорядиться.",
                path: "Власть",
                stats: { power: 2, rebellion: 1 }
            },
            {
                text: "🔮 Попытаешься понять её. Прежде чем использовать силу, я хочу узнать, почему она выбрала меня.",

                stats: { strength: 1, power: 1, loyalty: 1 }

];


let currentQuestion = 0;

let scores = {
    "Сила": 0,
    "Власть": 0,
    "Любовь": 0,
    "Свобода": 0
};


let stats = {
    strength: 0,
    power: 0,
    love: 0,
    freedom: 0,
    cruelty: 0,
    loyalty: 0,
    rebellion: 0,
    sacrifice: 0
};


const quiz = document.getElementById("quiz");


/* =========================
   START SCREEN
========================= */

function showStart() {

    quiz.innerHTML = "";

    const start = document.createElement("div");
    start.className = "start";

    start.innerHTML = `
        <div class="start-symbol">☯</div>

        <h1>СУДЬБА</h1>

        <div class="start-line"></div>

        <div class="start-subtitle">
            Небеса уже сделали свой выбор.<br>
            Осталось узнать — какой.
        </div>

        <button class="start-button" id="startButton">
            ✦ Узнать свою судьбу
        </button>

        <div class="start-note">
            5 вопросов · 1 судьба
        </div>
    `;

    quiz.appendChild(start);

    document
        .getElementById("startButton")
        .addEventListener("click", function() {
            currentQuestion = 0;
            showQuestion();
        });
}


/* =========================
   QUESTIONS
========================= */

function showQuestion() {

    const question = questions[currentQuestion];

    quiz.innerHTML = "";

    const screen = document.createElement("div");
    screen.className = "quiz-screen";

    const progress = document.createElement("div");
    progress.className = "progress";

    progress.textContent =
        "Вопрос " +
        (currentQuestion + 1) +
        " из " +
        questions.length;

    const questionText = document.createElement("div");
    questionText.className = "question";
    questionText.textContent = question.text;

    const answersContainer = document.createElement("div");
    answersContainer.className = "answers";

    question.answers.forEach(function(answer) {

        const button = document.createElement("button");

        button.type = "button";
        button.textContent = answer.text;

        button.addEventListener("click", function() {

            scores[answer.path]++;

            for (let stat in answer.stats) {
                stats[stat] += answer.stats[stat];
            }

            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }

        });

        answersContainer.appendChild(button);

    });

    screen.appendChild(progress);
    screen.appendChild(questionText);
    screen.appendChild(answersContainer);

    quiz.appendChild(screen);
}


/* =========================
   RESULT
========================= */

function showResult() {

    let destiny = getDestiny();

    quiz.innerHTML = "";

    const result = document.createElement("div");
    result.className = "result";

    result.innerHTML = `
        <div class="result-symbol">${destiny.symbol}</div>

        <h2>${destiny.name}</h2>

        <div class="rarity">
            ${destiny.rarity}
        </div>

        <div class="path">
            Путь: <strong>${destiny.path}</strong>
        </div>

        <div class="description">
            ${destiny.description}
        </div>

        <div class="restart">
            <button id="restartButton">
                🔄 Узнать другую судьбу
            </button>
        </div>
    `;

    quiz.appendChild(result);

    document
        .getElementById("restartButton")
        .addEventListener("click", restartQuiz);
}


/* =========================
   DESTINY ENGINE
========================= */

    let maxScore = -1;
    let selectedPath = "Сила";

                score: stats.cruelty * 2 + stats.rebellion * 2

            {
                symbol: "🌌",
                name: "Воин Небесного Предела",
                rarity: "🌑 МИФИЧЕСКАЯ СУДЬБА",
                path: "Силы",
                description:
                    "Ты не хочешь быть сильнее остальных. " +
                    "Ты хочешь однажды стать сильнее самого предела, " +
                    "который Небеса назвали невозможным.",
                score: stats.strength * 3 + stats.rebellion
            }

        ],


        "Власть": [

            {
                symbol: "👑",
                name: "Властелин Девяти Небес",
                rarity: "🔥 РЕДКАЯ СУДЬБА",
                path: "Власти",
                description:
                    "Ты умеешь заставлять мир двигаться в выбранном тобой направлении. " +
                    "Но чем выше трон, тем дальше от тебя люди.",
                score: stats.power * 3
            },

            {
                symbol: "⚖️",
                name: "Безмолвный Судья",
                rarity: "💎 ЭПИЧЕСКАЯ СУДЬБА",
                path: "Власти",
                description:
                    "Ты не спешишь карать. Ты сначала выслушиваешь всех — " +
                    "а затем выносишь приговор, от которого никто не сможет скрыться.",
                score: stats.loyalty * 2 + stats.strength + stats.cruelty
            },

            {
                symbol: "🕸️",
                name: "Кукловод Судеб",
                rarity: "💎 ЭПИЧЕСКАЯ СУДЬБА",
                path: "Власти",
                description:

            {

    const possibleDestinies = destinies[selectedPath];

    let bestDestiny = possibleDestinies[0];

    for (let i = 1; i < possibleDestinies.length; i++) {

        if (possibleDestinies[i].score > bestDestiny.score) {
            bestDestiny = possibleDestinies[i];
        }

    }

    return bestDestiny;
}


/* =========================
   RESTART
========================= */

function restartQuiz() {

    currentQuestion = 0;

    scores = {
