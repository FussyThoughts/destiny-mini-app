@keyframes fadeIn {

/*
    Каждая группа ответов связана с одним путём.

    0 = Сила
    1 = Власть
    2 = Любовь
    3 = Свобода
*/

const pathScores = {
    "Сила": 0,
    "Власть": 0,
    "Любовь": 0,
    "Свобода": 0
};


/*
    Внутренние характеристики.
    Пока они используются как скрытая основа
    для выбора конкретной судьбы.
*/

const stats = {
    strength: 0,
    power: 0,
    love: 0,
    freedom: 0,
    cruelty: 0,
    loyalty: 0,
    rebellion: 0,
    sacrifice: 0
};


let currentQuestion = 0;
let selectedAnswers = [];


const startScreen = document.getElementById("startScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

const progress = document.getElementById("progress");
const question = document.getElementById("question");
const answers = document.getElementById("answers");

const resultSymbol = document.getElementById("resultSymbol");
const resultTitle = document.getElementById("resultTitle");
const resultRarity = document.getElementById("resultRarity");
const resultTrait = document.getElementById("resultTrait");
const resultDescription = document.getElementById("resultDescription");
const resultChoice = document.getElementById("resultChoice");


function showScreen(screen) {

    startScreen.classList.add("hidden");
    quizScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");

    screen.classList.remove("hidden");

}


function resetStats() {

    pathScores.Сила = 0;
    pathScores.Власть = 0;
    pathScores.Любовь = 0;
    pathScores.Свобода = 0;

    stats.strength = 0;
    stats.power = 0;
    stats.love = 0;
    stats.freedom = 0;
    stats.cruelty = 0;
    stats.loyalty = 0;
    stats.rebellion = 0;
    stats.sacrifice = 0;

}


function applyAnswer(questionIndex, answerIndex) {

    const paths = [
        "Сила",
        "Власть",
        "Любовь",
        "Свобода"
    ];

    const path = paths[answerIndex];

    pathScores[path]++;

    /*
        Базовая характеристика пути
    */

    if (path === "Сила") {
        stats.strength++;
    }

    if (path === "Власть") {
        stats.power++;
    }

    if (path === "Любовь") {
        stats.love++;
    }

    if (path === "Свобода") {
        stats.freedom++;
    }


    /*
        Скрытые оттенки выбора.
        Они позволяют двум людям с одинаковым
        главным путём получить разные судьбы.
    */

    if (questionIndex === 0) {

        if (answerIndex === 0) {
            stats.strength++;
        }

        if (answerIndex === 1) {
            stats.power++;
        }

        if (answerIndex === 2) {
            stats.love++;
            stats.loyalty++;
        }

        if (answerIndex === 3) {
            stats.freedom++;
            stats.rebellion++;
        }

    }


    if (questionIndex === 1) {

        if (answerIndex === 0) {
            stats.cruelty++;
        }

        if (answerIndex === 1) {
            stats.freedom++;
        }

        if (answerIndex === 2) {
            stats.loyalty++;
            stats.sacrifice++;
        }

        if (answerIndex === 3) {
            stats.strength++;
            stats.rebellion++;
        }

    }


    if (questionIndex === 2) {

        if (answerIndex === 0) {
            stats.strength++;
            stats.cruelty++;
        }

        if (answerIndex === 1) {
            stats.love++;
            stats.sacrifice++;
        }

        if (answerIndex === 2) {
            stats.rebellion++;
            stats.freedom++;
        }

        if (answerIndex === 3) {
            stats.power++;
        }

    }


    if (questionIndex === 3) {

        if (answerIndex === 0) {
            stats.rebellion++;
        }

        if (answerIndex === 1) {
            stats.love++;
            stats.loyalty++;
            stats.sacrifice++;
        }

        if (answerIndex === 2) {
            stats.freedom++;
            stats.rebellion++;
        }

        if (answerIndex === 3) {
            stats.love++;
            stats.strength++;
        }

    }


    if (questionIndex === 4) {

        if (answerIndex === 0) {
            stats.power++;
        }

        if (answerIndex === 1) {
            stats.love++;
            stats.sacrifice++;
        }

        if (answerIndex === 2) {
            stats.power++;
            stats.cruelty++;
        }

        if (answerIndex === 3) {
            stats.strength++;
            stats.freedom++;
        }

    }

}


function getMainPath() {

    let bestPath = "Сила";
    let bestScore = pathScores.Сила;

    if (pathScores.Власть > bestScore) {
        bestPath = "Власть";
        bestScore = pathScores.Власть;
    }

    if (pathScores.Любовь > bestScore) {
        bestPath = "Любовь";
        bestScore = pathScores.Любовь;
    }

    if (pathScores.Свобода > bestScore) {
        bestPath = "Свобода";
        bestScore = pathScores.Свобода;
    }

    return bestPath;

}


function getDestiny() {

    const mainPath = getMainPath();

    const candidates = destinies.filter(function(destiny) {
        return destiny.path === mainPath;
    });


    /*
        Внутри каждого пути четыре судьбы.

        Первая — базовая.
        Вторая — более глубокая.
        Третья — экстремальная.
        Четвёртая — мифическая.

        Выбираем их по дополнительным характеристикам.
    */

    let index = 0;


    if (mainPath === "Сила") {

        if (stats.cruelty >= 2) {
            index = 2;
        } else if (stats.strength >= 4) {
            index = 3;
        } else if (stats.rebellion >= 2) {
            index = 1;
        }

    }


    if (mainPath === "Власть") {

        if (stats.cruelty >= 2) {
            index = 3;
        } else if (stats.power >= 4) {
            index = 2;
        } else if (stats.loyalty >= 2) {
            index = 1;
        }

    }


    if (mainPath === "Любовь") {

        if (stats.sacrifice >= 3) {
            index = 3;
        } else if (stats.loyalty >= 3) {
            index = 2;
        } else if (stats.love >= 4) {
            index = 1;
        }

    }


    if (mainPath === "Свобода") {

        if (stats.rebellion >= 3) {
            index = 3;
        } else if (stats.freedom >= 4) {
            index = 2;
        } else if (stats.rebellion >= 2) {
            index = 1;
        }

    }


    return candidates[index];

}


function showResult() {

    const destiny = getDestiny();
