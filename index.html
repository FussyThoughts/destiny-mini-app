<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Судьба</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0912;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header {
      text-align: center;
    }

    .symbol {
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 5px;
      margin: 0 0 12px;
    }

    .progress {
      color: #777080;
      font-size: 13px;
      margin-bottom: 42px;
    }

    .question {
      font-size: 23px;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 30px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .answer {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid #403750;
      background: #181522;
      color: white;
      font-size: 16px;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
    }

    .answer:active {
      background: #30234a;
      transform: scale(0.98);
    }

    .fade {
      animation: fade 0.3s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="header">
      <div class="symbol">☯</div>

      <h1>СУДЬБА</h1>

      <div class="progress" id="progress">
        ВОПРОС 1 ИЗ 5
      </div>
    </div>

    <section id="questionScreen" class="fade"></section>

  </main>


  <script>

    /*
      Здесь будут храниться ответы пользователя.

      Позже они будут влиять на:
      - путь культивации
      - талант
      - характер
      - оружие
      - редкость
      - судьбу
    */

    const userAnswers = [];


    const questions = [

      {
        text: "Ты станешь собой без капли сожаления, выбрав…",

        answers: [
          "⚔️ Силу, с которой нельзя не считаться.",
          "👑 Власть, устрашающую и благодетельную.",
          "❤️ Любовь, от которой невозможно отказаться.",
          "🕊️ Свободу в каждом вдохе."
        ]
      },

      {
        text: "Твой близкий человек предал тебя. Что ты сделаешь?",

        answers: [
          "⚔️ Отомщу. Предательство должно иметь цену.",
          "🚶 Уйду. Некоторые люди должны остаться в прошлом.",
          "❤️ Попытаюсь понять причину.",
          "🔥 Сожгу всё, что связывало нас."
        ]
      },

      {
        text: "Перед тобой путь к бессмертию. Его цена — жизнь незнакомца.",

        answers: [
          "🩸 Заплачу цену. Я выбрал свой путь.",
          "🚫 Откажусь. Чужая жизнь не стоит моего бессмертия.",
          "🎲 Найду третий путь.",
          "🤐 Сначала узнаю, кто этот человек."
        ]
      },

      {
        text: "Что страшнее всего потерять?",

        answers: [
          "🪞 Себя.",
          "🏯 Семью.",
          "🕊️ Свободу.",
          "🌑 Смысл."
        ]
      },

      {
        text: "Ты получил силу, которой больше никто не обладает.",

        answers: [
          "🤫 Спрячу её.",
          "❤️ Использую ради близких.",
          "👑 Подчиню мир.",
          "🔮 Попытаюсь понять её природу."
        ]
      }

    ];


    let currentQuestion = 0;


    function showQuestion() {

      const question = questions[currentQuestion];

      document.getElementById("progress").textContent =
        "ВОПРОС " + (currentQuestion + 1) + " ИЗ " + questions.length;


      const screen = document.getElementById("questionScreen");

      screen.className = "fade";

      screen.innerHTML = `

        <div class="question">
          ${question.text}
        </div>

        <div class="answers">

          ${question.answers.map((answer, index) => `

            <button
              class="answer"
              onclick="chooseAnswer(${index})">

              ${answer}

            </button>

          `).join("")}

        </div>

      `;

    }


    function chooseAnswer(answerIndex) {

      userAnswers.push({
        question: currentQuestion,
        answer: answerIndex
      });


      currentQuestion++;


      if (currentQuestion < questions.length) {

        showQuestion();

      } else {

        showResult();

      }

    }


    function showResult() {

      document.getElementById("progress").textContent =
        "СУДЬБА ОПРЕДЕЛЕНА";


      document.getElementById("questionScreen").innerHTML = `

        <div class="question">

          <h2>Твоя судьба пробуждается…</h2>

          <p>
            Ты сделал свой выбор.
          </p>

          <p>
            Скоро мы узнаем, кем ты стал.
          </p>

        </div>

      `;

      console.log("Ответы пользователя:", userAnswers);

    }


    showQuestion();

  </script>

</body>
</html>
