<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Судьба</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0912;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 30px 20px;
      text-align: center;
    }

    .symbol {
      font-size: 50px;
      margin-top: 30px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 5px;
      margin: 15px 0 10px;
    }

    .progress {
      color: #777080;
      font-size: 13px;
      margin-bottom: 40px;
    }

    .question {
      font-size: 23px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .answer {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid #403750;
      background: #181522;
      color: white;
      font-size: 16px;
      line-height: 1.5;
      text-align: left;
    }

    .answer:active {
      background: #30234a;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="symbol">☯</div>

    <h1>СУДЬБА</h1>

    <div class="progress">
      ВОПРОС 1 ИЗ 5
    </div>

    <div class="question">
      Ты станешь собой без капли сожаления, выбрав…
    </div>

    <div class="answers">

      <button class="answer">
        ⚔️ Силу, с которой нельзя не считаться.
      </button>

      <button class="answer">
        👑 Власть, устрашающую и благодетельную.
      </button>

      <button class="answer">
        ❤️ Любовь, от которой невозможно отказаться.
      </button>

      <button class="answer">
        🕊️ Свободу в каждом вдохе.
      </button>

    </div>

  </div>

</body>
</html>
