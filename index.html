<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100c18">
<title>СУДЬБА</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 25%, #281842 0%, #100c18 42%, #050508 100%);
    color: #ffffff;
    font-family: Georgia, "Times New Roman", serif;
}

button {
    font-family: inherit;
}

.hidden {
    display: none !important;
}

.screen {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}


/* =========================
   START
========================= */

.symbol {
    font-size: 68px;
    margin-bottom: 16px;
    opacity: 0.92;
    animation: float 4s ease-in-out infinite;
}

.start-title {
    margin: 0;
    font-size: 52px;
    font-weight: 400;
    letter-spacing: 10px;
}

.subtitle {
    max-width: 390px;
    margin-top: 22px;
    color: #cfc6dc;
    font-size: 18px;
    line-height: 1.6;
}

.start-button {
    margin-top: 40px;
    padding: 17px 32px;
    border: 1px solid #9279ad;
    border-radius: 12px;
    background: rgba(120, 80, 160, 0.18);
    color: #ffffff;
    font-size: 17px;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s ease;
}

.start-button:hover {
    background: rgba(140, 100, 180, 0.28);
}

.start-button:active {
    transform: scale(0.97);
}

.note {
    margin-top: 17px;
    color: #777080;
    font-family: Arial, sans-serif;
    font-size: 13px;
}


/* =========================
   QUIZ
========================= */

.quiz {
    width: 100%;
}

.progress {
    margin-bottom: 27px;
    color: #987fb0;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
}

.question {
    max-width: 500px;
    margin: 0 auto 30px;
    font-size: 24px;
    line-height: 1.45;
    font-weight: 400;
}

.answers {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 17px 18px;
    border: 1px solid rgba(143, 120, 173, 0.55);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.035);
    color: #eee9f2;
    font-size: 16px;
    line-height: 1.42;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s ease;
}

.answer:hover {
    background: rgba(143, 120, 173, 0.15);
    border-color: #a48abb;
}

.answer:active {
    transform: scale(0.98);
}


/* =========================
   RESULT CARD
========================= */

.result-screen {
    padding-top: 25px;
    padding-bottom: 25px;
}

.destiny-card {
    width: 100%;
    padding: 31px 23px;
    border: 1px solid rgba(154, 130, 180, 0.65);
    border-radius: 23px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(143, 120, 173, 0.19),
            rgba(10, 8, 15, 0.96) 58%
        );

    box-shadow:
        0 0 45px rgba(90, 55, 120, 0.18),
        inset 0 0 35px rgba(255, 255, 255, 0.025);

    position: relative;
    overflow: hidden;

    animation: destinyAppear 0.75s ease;
}

.destiny-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 16%;
    right: 16%;
    height: 1px;
    background: rgba(255, 255, 255, 0.35);
}

.card-top {
    color: #9279ad;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
}

.result-symbol {
    margin-top: 24px;
    font-size: 65px;
    animation: symbolAppear 0.9s ease;
}

.result-rarity {
    margin-top: 18px;
    color: #d0bddc;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
}

.result-title {
    max-width: 460px;
    margin: 12px auto 0;
    font-size: 31px;
    line-height: 1.28;
    font-weight: 400;
}

.result-trait {
    margin-top: 12px;
    color: #a99cad;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.card-divider {
    margin: 24px auto 19px;
    color: #806b91;
    font-size: 14px;
}

.result-description {
    max-width: 430px;
    margin: 0 auto;
    color: #d0c8d6;
    font-size: 16px;
    line-height: 1.72;
}

.card-footer {
    margin-top: 27px;
    color: #706675;
    font-family: Arial, sans-serif;
    font-size: 11px;
    line-height: 1.5;
}

.share-button {
    width: 100%;
    margin-top: 23px;
    padding: 16px 28px;
    border: 1px solid #9279ad;
    border-radius: 12px;
    background: rgba(120, 80, 160, 0.18);
    color: #ffffff;
    font-size: 15px;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s ease;
}

.share-button:hover {
    background: rgba(140, 100, 180, 0.28);
    border-color: #a48abb;
}

.share-button:active {
    transform: scale(0.98);
}

.share-button:disabled {
    opacity: 0.65;
    cursor: default;
}

.restart-button {
    margin-top: 23px;
    padding: 14px 28px;
    border: 1px solid #665477;
    border-radius: 10px;
    background: transparent;
    color: #aaa0b4;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
}

.restart-button:active {
    transform: scale(0.97);
}


/* =========================
   ANIMATIONS
========================= */

@keyframes float {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

@keyframes destinyAppear {

    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes symbolAppear {

    0% {
        opacity: 0;
        transform: scale(0.5) rotate(-10deg);
    }

    70% {
        transform: scale(1.08) rotate(2deg);
    }

    100% {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.fade {
    animation: fadeIn 0.4s ease;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 420px) {

    .screen {
        padding-left: 16px;
        padding-right: 16px;
    }

    .start-title {
        font-size: 45px;
        letter-spacing: 8px;
    }

    .question {
        font-size: 21px;
    }

    .answer {
        font-size: 15px;
        padding: 16px;
    }

    .result-title {
        font-size: 27px;
    }

    .destiny-card {
        padding: 28px 19px;
    }
}
</style>
</head>

    <button
        id="restartButton"

        Пройти заново

</section>

   PATHS
========================= */

const paths = [
    "Сила",
    "Власть",
      "Любовь",
    "Свобода"
];


/* =========================
   STATE
========================= */

let currentQuestion = 0;

let selectedAnswers = [];

let pathScores = {
    "Сила": 0,
    "Власть": 0,
    "Любовь": 0,
    "Свобода": 0
};

let stats = {
    strength: 0,
    power: 0,
    love: 0,
    freedom: 0,
    cruelty: 0,
    loyalty: 0,
    rebellion: 0,
    sacrifice: 0
};


/* =========================
   ELEMENTS
========================= */

const startScreen =
    document.getElementById("startScreen");

const quizScreen =
    document.getElementById("quizScreen");

const resultScreen =
    document.getElementById("resultScreen");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restartButton");

const progress =
    document.getElementById("progress");

const question =
    document.getElementById("question");

const answers =
    document.getElementById("answers");

const resultSymbol =
    document.getElementById("resultSymbol");

const resultTitle =
    document.getElementById("resultTitle");

const resultRarity =
    document.getElementById("resultRarity");

const resultTrait =
    document.getElementById("resultTrait");

const resultDescription =
    document.getElementById("resultDescription");


/* =========================
   SCREEN CONTROL
========================= */

function showScreen(screen) {

    startScreen.classList.add("hidden");

    quizScreen.classList.add("hidden");

    resultScreen.classList.add("hidden");

    screen.classList.remove("hidden");

}


/* =========================
   RESET
========================= */

function resetGame() {

    currentQuestion = 0;

    selectedAnswers = [];

    pathScores = {
        "Сила": 0,
        "Власть": 0,
        "Любовь": 0,
        "Свобода": 0
    };

    stats = {
        strength: 0,
        power: 0,
        love: 0,
        freedom: 0,
        cruelty: 0,
        loyalty: 0,
        rebellion: 0,
        sacrifice: 0
    };

}


/* =========================
   APPLY ANSWER
========================= */

function applyAnswer(questionIndex, answerIndex) {

    const path = paths[answerIndex];

    pathScores[path]++;


    if (path === "Сила") {
        stats.strength++;
    }

    if (path === "Власть") {
        stats.power++;
    }

    if (path === "Любовь") {
        stats.love++;
    }

    if (path === "Свобода") {
        stats.freedom++;
    }


    /* QUESTION 1 */

    if (questionIndex === 0) {

        if (answerIndex === 0) {
            stats.strength++;
        }

        if (answerIndex === 1) {
            stats.power++;
        }

        if (answerIndex === 2) {
            stats.love++;
            stats.loyalty++;
        }

        if (answerIndex === 3) {
            stats.freedom++;
            stats.rebellion++;
        }

    }


    /* QUESTION 2 */

    if (questionIndex === 1) {

        if (answerIndex === 0) {
            stats.cruelty++;
        }

        if (answerIndex === 1) {
            stats.freedom++;
        }

        if (answerIndex === 2) {
            stats.loyalty++;
            stats.sacrifice++;
        }

        if (answerIndex === 3) {
            stats.strength++;
            stats.rebellion++;
        }

    }


    /* QUESTION 3 */

    if (questionIndex === 2) {

        if (answerIndex === 0) {
            stats.strength++;
            stats.cruelty++;
        }

        if (answerIndex === 1) {
            stats.love++;
            stats.sacrifice++;
        }

        if (answerIndex === 2) {
            stats.rebellion++;
            stats.freedom++;
        }

        if (answerIndex === 3) {
            stats.power++;
        }

    }


    /* QUESTION 4 */

    if (questionIndex === 3) {

        if (answerIndex === 0) {
            stats.rebellion++;
        }

        if (answerIndex === 1) {
            stats.love++;
            stats.loyalty++;
            stats.sacrifice++;
        }

        if (answerIndex === 2) {
            stats.freedom++;
            stats.rebellion++;
        }

        if (answerIndex === 3) {
            stats.love++;
            stats.strength++;
        }

    }


    /* QUESTION 5 */

    if (questionIndex === 4) {

        if (answerIndex === 0) {
            stats.power++;
        }

        if (answerIndex === 1) {
            stats.love++;
            stats.sacrifice++;
        }

        if (answerIndex === 2) {
            stats.power++;
            stats.cruelty++;
        }

        if (answerIndex === 3) {
            stats.strength++;
            stats.freedom++;
        }

    }

}


/* =========================
   MAIN PATH
========================= */

function getMainPath() {

    let bestPath = "Сила";

    let bestScore = pathScores["Сила"];


    if (pathScores["Власть"] > bestScore) {

        bestPath = "Власть";

        bestScore = pathScores["Власть"];

    }


    if (pathScores["Любовь"] > bestScore) {

        bestPath = "Любовь";

        bestScore = pathScores["Любовь"];

    }


    if (pathScores["Свобода"] > bestScore) {

        bestPath = "Свобода";

        bestScore = pathScores["Свобода"];

    }


    return bestPath;

}


/* =========================
   DESTINY
========================= */

function getDestiny() {

    const mainPath = getMainPath();


    const candidates =
        destinies.filter(function(destiny) {

            return destiny.path === mainPath;

        });


    let index = 0;


    if (mainPath === "Сила") {

        if (stats.cruelty >= 2) {

            index = 2;

        } else if (stats.strength >= 4) {

            index = 3;

        } else if (stats.rebellion >= 2) {

            index = 1;

        }

    }


    if (mainPath === "Власть") {

        if (stats.cruelty >= 2) {

            index = 3;

        } else if (stats.power >= 4) {

            index = 2;

        } else if (stats.loyalty >= 2) {

            index = 1;

        }

    }


    if (mainPath === "Любовь") {

        if (stats.sacrifice >= 3) {

            index = 3;

        } else if (stats.loyalty >= 3) {

            index = 2;

        } else if (stats.love >= 4) {

            index = 1;

        }

    }


    if (mainPath === "Свобода") {

        if (stats.rebellion >= 3) {

            index = 3;

        } else if (stats.freedom >= 4) {

            index = 2;

        } else if (stats.rebellion >= 2) {

            index = 1;

        }

    }


    return candidates[index];

}


/* =========================
   SHOW RESULT
========================= */

function showResult() {

    const destiny = getDestiny();


    resultSymbol.textContent =
        destiny.symbol;

    resultTitle.textContent =
        destiny.title;

    resultRarity.textContent =
        destiny.rarity;

    resultTrait.textContent =
        destiny.trait;

    resultDescription.textContent =
        destiny.description;


    showScreen(resultScreen);

}


/* =========================
   QUESTION
========================= */

function showQuestion() {

    const q =
        questions[currentQuestion];


    progress.textContent =
        "ВОПРОС " +
        (currentQuestion + 1) +
        " ИЗ " +
        questions.length;


    question.textContent =
        q.text;


    answers.innerHTML = "";


    answers.classList.remove("fade");

    void answers.offsetWidth;

    answers.classList.add("fade");


    q.answers.forEach(function(
        answerText,
        index
    ) {

        const button =
            document.createElement("button");


        button.type = "button";

        button.className = "answer";

        button.textContent =
            answerText;


        button.addEventListener(
            "click",
            function() {

                selectedAnswers.push({

                    question: currentQuestion,

                    answer: index

                });


                applyAnswer(
                    currentQuestion,
                    index
                );


                currentQuestion++;


                if (
                    currentQuestion <
                    questions.length
                ) {

                    showQuestion();

                } else {

                    showResult();

                }

            }
        );


        answers.appendChild(button);

    });

}


/* =========================
   START
========================= */

function startQuiz() {

    resetGame();

    showScreen(quizScreen);

    showQuestion();

}


/* =========================
   RESTART
========================= */

function restartQuiz() {

    resetGame();

    showScreen(startScreen);

}


/* =========================
   TELEGRAM
========================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {

    try {
        tg.ready();
        tg.expand();

        if (tg.setHeaderColor) {
            tg.setHeaderColor("#100c18");
        }

        if (tg.setBackgroundColor) {
            tg.setBackgroundColor("#100c18");
        }
    } catch (error) {
        console.warn("Telegram WebApp init:", error);
    }

}


/* =========================
   SHARE
========================= */

function getShareText() {

    return (
        "Моя судьба — " +
        resultTitle.textContent +
        "\n\n" +
        "Узнай свою судьбу: " +
        window.location.href
    );

}


function haptic() {

    if (
        tg &&
        tg.HapticFeedback &&
        tg.HapticFeedback.impactOccurred
    ) {

        try {
            tg.HapticFeedback.impactOccurred("light");
        } catch (error) {
            console.warn("Haptic feedback:", error);
        }

    }

}


async function shareDestiny() {

    const text = getShareText();
    const url = window.location.href;

    haptic();

    /*
     * В Telegram сначала используем официальный share URL.
     * Он открывает выбор чата/канала для отправки результата.
     */
    if (tg) {

        const telegramShareUrl =
            "https://t.me/share/url?url=" +
            encodeURIComponent(url) +
            "&text=" +
            encodeURIComponent(
                "Моя судьба — " +
                resultTitle.textContent +
                "\n\nУзнай свою судьбу:"
            );

        try {

            if (tg.openTelegramLink) {
                tg.openTelegramLink(telegramShareUrl);
            } else {
                window.location.href = telegramShareUrl;
            }

            return;

        } catch (error) {

            console.warn(
                "Telegram share:",
                error
            );

        }

    }


    /*
     * В обычном браузере используем системное меню "Поделиться".
     */
    if (
        navigator.share &&
        typeof navigator.share === "function"
    ) {

        try {

            await navigator.share({
                title: "Моя судьба",
                text: text,
                url: url
            });

            return;

        } catch (error) {

            /*
             * AbortError означает, что пользователь
             * просто закрыл меню. Ничего делать не нужно.
             */
            if (error && error.name === "AbortError") {
                return;
            }

        }

    }


    /*
     * Резервный вариант: копируем текст.
     */
    try {

        if (
            navigator.clipboard &&
            navigator.clipboard.writeText
        ) {

            await navigator.clipboard.writeText(text);

            alert(
                "Судьба скопирована.\n\n" +
                "Отправь её другу."
            );

            return;

        }

    } catch (error) {

        console.warn(
            "Clipboard:",
            error
        );

    }


    /*
     * Последний резервный вариант для старых браузеров.
     */
    window.prompt(
        "Скопируй свою судьбу:",
        text
    );

}


/* =========================
   BUTTONS
========================= */

startButton.addEventListener(
    "click",
    function() {

        haptic();
        startQuiz();

    }
);


restartButton.addEventListener(
    "click",
    function() {

        haptic();
        restartQuiz();

    }
);


const shareButton =
    document.getElementById("shareBtn");


if (shareButton) {

    shareButton.addEventListener(
        "click",
        shareDestiny
    );

}
