<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Судьба</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0912;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header {
      text-align: center;
    }

    .symbol {
      font-size: 50px;
      margin-top: 20px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 5px;
      margin: 15px 0 10px;
    }

    .progress {
      color: #777080;
      font-size: 13px;
      margin-bottom: 40px;
    }

    .question {
      font-size: 23px;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 30px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .answer {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid #403750;
      background: #181522;
      color: white;
      font-size: 16px;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: 0.25s;
    }

    .answer:active {
      transform: scale(0.98);
    }

    .answer.selected {
      background: #30234a;
      border-color: #9b7ac7;
    }

    .fade {
      animation: fade 0.35s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="header">

      <div class="symbol">☯</div>

      <h1>СУДЬБА</h1>

      <div id="progress" class="progress">
        ВОПРОС 1 ИЗ 5
      </div>

    </div>

    <section id="questionScreen" class="fade">

      <div id="question" class="question"></div>

      <div id="answers" class="answers"></div>

    </section>

  </main>


  <script>

    const questions = [

      {
        text: "Ты станешь собой без капли сожаления, выбрав…",

        answers: [
          "⚔️ Силу, с которой нельзя не считаться.",
          "👑 Власть, устрашающую и благодетельную.",
          "❤️ Любовь, от которой невозможно отказаться.",
          "🕊️ Свободу в каждом вдохе."
        ]
      },

      {
        text: "Тот, кому ты доверял больше всего, предал тебя. Что ты сделаешь?",

        answers: [
          "⚔️ Отомщу, чтобы он никогда не забыл.",
          "🚶 Уйду. Некоторые связи должны умереть.",
          "❤️ Попытаюсь понять причину его поступка.",
          "🔥 Сотру прошлое и начну всё заново."
        ]
      }

    ];


    let currentQuestion = 0;

    const chosenAnswers = [];


    function showQuestion() {

      const question = questions[currentQuestion];

      document.getElementById("progress").textContent =
        "ВОПРОС " + (currentQuestion + 1) + " ИЗ 5";

      document.getElementById("question").textContent =
        question.text;

      const answersContainer =
        document.getElementById("answers");

      answersContainer.innerHTML = "";

      question.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = () => chooseAnswer(index, button);

        answersContainer.appendChild(button);

      });

      const screen =
        document.getElementById("questionScreen");

      screen.classList.remove("fade");

      void screen.offsetWidth;

      screen.classList.add("fade");
    }


    function chooseAnswer(index, button) {

      chosenAnswers[currentQuestion] = index;

      button.classList.add("selected");

      setTimeout(() => {

        if (currentQuestion < questions.length - 1) {

          currentQuestion++;

          showQuestion();

        } else {

          alert(
            "Первые ответы приняты.\n\n" +
            "Судьба продолжает пробуждаться..."
          );

        }

      }, 300);

    }


    showQuestion();

  </script>

</body>
</html>
