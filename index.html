<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>Судьба</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #0b0912;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header {
      text-align: center;
    }

    .symbol {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      letter-spacing: 5px;
    }

    .progress {
      margin-bottom: 38px;
      color: #777080;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .question {
      margin-bottom: 28px;
      text-align: center;
      font-size: 22px;
      line-height: 1.5;
    }

    .answers {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .answer {
      appearance: none;
      -webkit-appearance: none;

      display: block;
      width: 100%;
      min-height: 64px;

      padding: 16px;

      border: 1px solid #403750;
      border-radius: 16px;

      background: #181522;
      color: #ffffff;

      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      text-align: left;

      cursor: pointer;

      touch-action: manipulation;
    }

    .answer:active {
      background: #342552;
      border-color: #8062b8;
    }

    .answer.selected {
      background: #342552;
      border-color: #a98adf;
    }

    .message {
      text-align: center;
      color: #bcb3ca;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="header">

      <div class="symbol">☯</div>

      <h1>СУДЬБА</h1>

      <div
        class="progress"
        id="progress">
        ВОПРОС 1 ИЗ 5
      </div>

    </div>

    <div id="questionScreen"></div>

  </main>


  <script>

    var currentQuestion = 0;

    var userAnswers = [];


    var questions = [

      {
        text: "Ты станешь собой без капли сожаления, выбрав…",

        answers: [
          "⚔️ Силу, с которой нельзя не считаться.",
          "👑 Власть, устрашающую и благодетельную.",
          "❤️ Любовь, от которой невозможно отказаться.",
          "🕊️ Свободу в каждом вдохе."
        ]
      },

      {
        text: "Твой близкий человек предал тебя. Что ты сделаешь?",

        answers: [
          "⚔️ Отомщу. Предательство должно иметь цену.",
          "🚶 Уйду. Некоторые люди должны остаться в прошлом.",
          "❤️ Попытаюсь понять причину.",
          "🔥 Сожгу всё, что связывало нас."
        ]
      },

      {
        text: "Перед тобой путь к бессмертию. Его цена — жизнь незнакомца.",

        answers: [
          "🩸 Заплачу цену. Я выбрал свой путь.",
          "🚫 Откажусь. Чужая жизнь не стоит моего бессмертия.",
          "🎲 Найду третий путь.",
          "🤐 Сначала узнаю, кто этот человек."
        ]
      },

      {
        text: "Что страшнее всего потерять?",

        answers: [
          "🪞 Себя.",
          "🏯 Семью.",
          "🕊️ Свободу.",
          "🌑 Смысл."
        ]
      },

      {
        text: "Ты получил силу, которой больше никто не обладает.",

        answers: [
          "🤫 Спрячу её.",
          "❤️ Использую ради близких.",
          "👑 Подчиню мир.",
          "🔮 Попытаюсь понять её природу."
        ]
      }

    ];


    function showQuestion() {

      var question = questions[currentQuestion];

      var progress = document.getElementById("progress");

      progress.textContent =
        "ВОПРОС " +
        (currentQuestion + 1) +
        " ИЗ " +
        questions.length;


      var screen =
        document.getElementById("questionScreen");


      screen.innerHTML = "";


      var questionText =
        document.createElement("div");

      questionText.className = "question";

      questionText.textContent =
        question.text;


      screen.appendChild(questionText);


      var answers =
        document.createElement("div");

      answers.className = "answers";


      for (
        var i = 0;
        i < question.answers.length;
        i++
      ) {

        var button =
          document.createElement("button");

        button.type = "button";

        button.className = "answer";

        button.textContent =
          question.answers[i];


        button.dataset.answer =
          i;


        button.addEventListener(
          "click",
          handleAnswer
        );


        answers.appendChild(button);

      }


      screen.appendChild(answers);

    }


    function handleAnswer(event) {

      var button =
        event.currentTarget;


      var answerIndex =
        Number(button.dataset.answer);


      button.classList.add("selected");


      userAnswers.push({

        question: currentQuestion,

        answer: answerIndex

      });


      setTimeout(function() {

        currentQuestion++;


        if (
          currentQuestion <
          questions.length
        ) {

          showQuestion();

        } else {

          showResult();

        }

      }, 180);

    }


    function showResult() {

      document.getElementById("progress")
        .textContent =
        "СУДЬБА ОПРЕДЕЛЕНА";


      var screen =
        document.getElementById("questionScreen");


      screen.innerHTML = "";


      var result =
        document.createElement("div");


      result.className = "message";


      result.innerHTML =
        "<h2>Твоя судьба пробуждается…</h2>" +
        "<p>Ты сделал свой выбор.</p>" +
        "<p>Скоро мы узнаем, кем ты стал.</p>";


      screen.appendChild(result);


      console.log(
        "Ответы:",
        userAnswers
      );

    }


    showQuestion();

  </script>

</body>
</html>
