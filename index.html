<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Судьба</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, #34245c 0%, #171329 35%, #080811 75%);
      color: #f5f1ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 32px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .symbol {
      font-size: 64px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 18px rgba(190, 150, 255, 0.45));
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 4px;
    }

    .subtitle {
      margin-top: 16px;
      color: #c7bfd9;
      font-size: 18px;
      line-height: 1.5;
    }

    .description {
      margin: 28px 0;
      color: #9188a8;
      font-size: 15px;
      line-height: 1.6;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 17px 24px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #7655d6, #a06be8);
      box-shadow: 0 8px 30px rgba(118, 85, 214, 0.35);
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .version {
      margin-top: 28px;
      color: #625a76;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="symbol">☯</div>

    <h1>СУДЬБА</h1>

    <div class="subtitle">
      Кем ты был бы<br>
      в мире культивации?
    </div>

    <div class="description">
      Пять решений определят твой путь,
      талант, судьбу и место среди тех,
      кто ступил на путь бессмертия.
    </div>

    <button onclick="startDestiny()">
      УЗНАТЬ СВОЮ СУДЬБУ
    </button>

    <div class="version">
      Версия 0.1
    </div>

  </main>

  <script>
    function startDestiny() {
      alert("Судьба пробудилась...");
    }
  </script>

</body>
</html>
