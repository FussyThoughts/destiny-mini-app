/* =========================

========================= */

function showQuestion() {

    const question = questions[currentQuestion];

    quiz.innerHTML = "";


    const progress = document.createElement("div");

    progress.className = "progress";

    progress.textContent =
        "Вопрос " +
        (currentQuestion + 1) +
        " из " +
        questions.length;


    const questionText = document.createElement("div");

    questionText.className = "question";

    questionText.textContent = question.text;


    const answersContainer =
        document.createElement("div");

    answersContainer.className = "answers";


    question.answers.forEach(function(answer) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.textContent = answer.text;


        button.addEventListener("click", function() {

            for (let stat in answer.stats) {

                scores[stat] += answer.stats[stat];

            }


            currentQuestion++;


            if (currentQuestion < questions.length) {

                showQuestion();

            } else {

                showResult();

            }

        });


        answersContainer.appendChild(button);

    });


    quiz.appendChild(progress);

    quiz.appendChild(questionText);

    quiz.appendChild(answersContainer);

}


/* =========================

function getDestiny() {

    const s = scores;


    /*
       Мифические судьбы
    */


    if (
        s.freedom >= 7 &&
        s.rebellion >= 6
    ) {

        return destinies["outside"];

    }


    if (
        s.strength >= 6 &&
        s.rebellion >= 4 &&
        s.cruelty <= 2
    ) {

        return destinies["heavenWarrior"];

    }


    if (
        s.power >= 7 &&
        s.rebellion >= 2
    ) {

        return destinies["aboveHeaven"];

    }


    if (
        s.love >= 6 &&
        s.sacrifice >= 4
    ) {

        return destinies["afterDeath"];

    }


    /*
       Эпические судьбы
    */


    if (
        s.strength >= 5 &&
        s.cruelty >= 3
    ) {

        return destinies["destroyer"];

    }


    if (
        s.strength >= 4 &&
        s.loyalty >= 3
    ) {

        return destinies["guardian"];

    }


    if (
        s.power >= 4 &&
        s.cruelty >= 2
    ) {

        return destinies["puppeteer"];

    }


    if (
        s.power >= 4 &&
        s.rebellion <= 1
    ) {

        return destinies["judge"];

    }


    if (
        s.love >= 4 &&
        s.sacrifice >= 2
    ) {

        return destinies["returner"];

    }


    if (
        s.love >= 4 &&
        s.loyalty >= 4
    ) {

        return destinies["redThread"];

    }


    if (
        s.freedom >= 4 &&
        s.rebellion >= 4
    ) {

        return destinies["thirdPath"];

    }


    if (
        s.freedom >= 4 &&
        s.rebellion <= 2
    ) {

        return destinies["wanderer"];

    }


    /*
       Редкие судьбы
    */


    if (
        s.strength >= s.power &&
        s.strength >= s.love &&
        s.strength >= s.freedom
    ) {

        return destinies["bloodBlade"];

    }


    if (
        s.power >= s.strength &&
        s.power >= s.love &&
        s.power >= s.freedom
    ) {

        return destinies["nineHeavens"];

    }


    if (
        s.love >= s.strength &&
        s.love >= s.power &&
        s.love >= s.freedom
    ) {

        return destinies["lastOath"];

    }


    return destinies["wanderer"];

}
